// ===== Llista d'articles comuna a Nova comanda ('order') i Articles ('articles') =====
// Mateixos filtres, mateixa cerca («Cerca o crea un article»), mateixos grups per categoria i mateixes files.
// A Nova comanda, prémer una fila l'afegeix a la comanda; a Articles, la marca per a les accions de diversos articles.
const listState = {
  order:{get search() { return orderSearch; }, set search(value) { orderSearch = value; },
    get category() { return orderCategory; }, set category(value) { orderCategory = value; },
    get supplier() { return orderSupplier; }, set supplier(value) { orderSupplier = value; }},
  articles:{get search() { return articleSearch; }, set search(value) { articleSearch = value; },
    get category() { return categoryFilter; }, set category(value) { categoryFilter = value; },
    get supplier() { return supplierFilter; }, set supplier(value) { supplierFilter = value; }}
};
const byName = (a,b) => a.name.localeCompare(b.name,'ca',{sensitivity:'base'});

function listFilters(mode) {
  const state = listState[mode];
  return '<label>Categoria<select data-list-filter="category" data-list="'+mode+'">'+categoryOptions(state.category,'Totes')+
      '<option value="-"'+(state.category === '-' ? ' selected' : '')+'>Sense categoria</option></select></label>'+
    '<label>Proveïdor<select data-list-filter="supplier" data-list="'+mode+'">'+options([...data.suppliers].sort(byName),state.supplier,'Tots')+'</select></label>';
}

function listLookup(mode) {
  return '<div class="order-lookup"><form class="article-lookup" data-list-lookup="'+mode+'">'+
    '<label>Cerca o crea un article<input id="'+mode+'-search" data-list-search="'+mode+'" name="articleName" placeholder="Cerca pel nom" type="search" enterkeyhint="done" maxlength="120" autocomplete="off" value="'+escape(listState[mode].search)+'"></label>'+
    '<button type="submit" class="primary" data-list-create="'+mode+'"'+(canCreateSearched(mode) ? '' : ' hidden')+'>Crea l’article</button>'+
    // Nova comanda: l'ull («Només la comanda»), petit i sense text, a la dreta de la cerca; sempre visible.
    (mode === 'order' ? '<button type="button" id="order-visibility" class="list-mode lookup-eye" aria-pressed="'+onlyOrdered+'" aria-label="Només la comanda" title="Només la comanda"><span aria-hidden="true">👁︎</span></button>' : '')+
    '</form></div>';
}

// El botó «Crea l'article» només surt quan el nom buscat no existeix.
function canCreateSearched(mode) {
  const query = searchKey(listState[mode].search);
  return Boolean(query) && !data.articles.some(article => matchesArticleName(article,query,true));
}

function articleList(mode) {
  const state = listState[mode];
  const query = searchKey(state.search);
  const draft = data.draft.lines;
  const byArticle = Map.groupBy(draft.filter(line => !orderSupplier || line.supplier === orderSupplier),line => line.article);
  const withSupplier = new Set(state.supplier ? data.offers.filter(offer => offer.supplier_id === state.supplier).map(offer => offer.article_id) : []);
  const articles = data.articles.filter(article => {
    const ordered = mode === 'order' && byArticle.has(article.id);
    if (mode === 'order' ? article.archived && !ordered : Boolean(article.archived) !== archivedArticles) return false;
    if (state.category && !inCategory(article.category_id,state.category)) return false;
    if (state.supplier && !withSupplier.has(article.id) && !ordered) return false;
    if (query) return matchesArticleName(article,query);
    return !(mode === 'order' && onlyOrdered && !ordered);
  });
  const groups = Map.groupBy(articles,article => article.category_id || '');
  const html = [...groups].sort(([a],[b]) => categoryRank(a)-categoryRank(b)).map(([category,items]) => {
    items.sort(byName);
    const marked = items.filter(article => mode === 'order' ? byArticle.has(article.id) : mergeSelection.has(article.id)).length;
    const rows = items.map(article => {
      if (mode === 'articles') return articleSwipe(article,selectListRow(article));
      const lines = byArticle.get(article.id);
      return articleSwipe(article,lines ? lines.map(line => orderListRow(article,line,draft.indexOf(line))).join('') : orderListRow(article));
    }).join('');
    return categoryGroup(mode,category,items.length+(items.length === 1 ? ' article' : ' articles')+(marked ? ' · ✓ '+marked : ''),rows,Boolean(query || state.category));
  }).join('');
  if (html) return html;
  if (query) return empty('Cap article coincideix amb «'+escape(state.search.trim())+'».'+(canCreateSearched(mode) ? ' Prem «Crea l’article» per crear-lo.' : ''));
  if (state.category || state.supplier) return empty('No hi ha articles que coincideixin amb els filtres.');
  if (mode === 'order' && onlyOrdered) return empty('Encara no hi ha cap article a la comanda.');
  if (mode === 'articles' && archivedArticles) return empty('No hi ha articles arxivats.');
  return empty(!request && !data.articles.length ? 'El catàleg de prova és buit. Escriu un nom a «Cerca o crea un article» per crear-ne un.' : 'El catàleg és buit.');
}

// Detall d'una fila sense marcar (igual a les dues pantalles): proveïdors · unitat de compra.
function articleDetail(article, onlySupplier = '') {
  const suppliers = data.offers.filter(offer => offer.article_id === article.id && (!onlySupplier || offer.supplier_id === onlySupplier))
    .map(offer => byId('suppliers',offer.supplier_id)?.name).filter(Boolean);
  return [suppliers.join(' · ') || 'Sense proveïdor',byId('units',article.unit_id)?.name].filter(Boolean).join(' · ');
}

// Fila de la pantalla Articles: igual que la de Nova comanda, però prémer-la la marca (casella) i el llapis obre la fitxa.
function selectListRow(article) {
  const name = escape(article.name);
  const id = escape(article.id);
  const selected = mergeSelection.has(article.id);
  const detail = articleDetail(article,supplierFilter);
  return '<div class="order-list-row is-select'+(selected ? ' is-selected' : '')+'">'+
    '<button type="button" class="order-toggle" data-select-article="'+id+'" aria-pressed="'+selected+'" title="'+escape(article.name+' · '+detail)+'">'+
    '<span class="order-marker" aria-hidden="true">'+(selected ? '✓' : '')+'</span><span class="order-item-copy">'+
    '<strong>'+name+'</strong><span class="meta">'+escape(detail)+'</span></span></button>'+
    '<button type="button" class="order-pencil" data-article-sheet="'+id+'" data-from-tools aria-haspopup="dialog" aria-label="Fitxa de '+name+'"><span aria-hidden="true">✎</span></button></div>';
}

function refreshList(mode) {
  const list = document.querySelector('#list-'+mode);
  if (!list) return;
  list.innerHTML = articleList(mode);
  const create = document.querySelector('[data-list-create="'+mode+'"]');
  if (create) create.hidden = !canCreateSearched(mode);
  const toggle = document.querySelector('[data-toggle-groups="'+mode+'"]');
  if (toggle) {
    toggle.textContent = collapsedGroups[mode].size ? 'Desplega-ho tot' : 'Replega-ho tot';
    toggle.hidden = Boolean(searchKey(listState[mode].search));
  }
}

function matchesArticleName(article, query, exact = false) {
  return [article.name,article.shared_name].filter(Boolean)
    .some(name => exact ? searchKey(name) === query : searchKey(name).includes(query));
}

function order() {
  const draft = data.draft.lines;
  return '<article class="card order-lines">'+listHeading('Nova comanda',draftArticleIds().size+' de '+data.articles.filter(article => !article.archived).length+' articles a la comanda','order','')+
    pushNotice()+
    listTools('order')+'<div id="list-order">'+articleList('order')+'</div>'+
    // Només els administradors envien la comanda als proveïdors; la resta només hi afegeixen articles.
    (draft.length && data.me?.admin ? '<div class="actions order-send"><button class="primary" id="generate">Desa i genera els missatges</button></div>' : '')+
    '</article>';
}

function matchesOrderCategory(article) {
  return inCategory(article?.category_id,orderCategory);
}

function categoryName(id) {
  return byId('categories',id)?.name || 'Sense categoria';
}

// ---- Subcategories (un sol nivell: ex. Vins → Vins blancs, Escumosos) ----
// Ordre de pantalla: cada categoria principal (en l'ordre triat) seguida de les seves subcategories.
// Una subcategoria la categoria principal de la qual ja no hi és es mostra com a principal.
function categoryTree() {
  const ids = new Set(data.categories.map(item => item.id));
  const isChild = item => item.parent_id && ids.has(item.parent_id) && item.parent_id !== item.id;
  const result = [];
  for (const item of data.categories) {
    if (isChild(item)) continue;
    result.push({...item,depth:0});
    for (const child of data.categories) if (isChild(child) && child.parent_id === item.id) result.push({...child,depth:1});
  }
  return result;
}
// Opcions d'un desplegable de categories amb les subcategories sagnades.
const categoryOptions = (selected, label) => '<option value="">'+label+'</option>'+categoryTree().map(item =>
  '<option value="'+escape(item.id)+'" '+(item.id === selected ? 'selected' : '')+'>'+(item.depth ? '\u00a0\u00a0— ' : '')+escape(item.name)+'</option>').join('');
// Un article de la subcategoria també és de la categoria principal (filtres).
function inCategory(articleCategory, filter) {
  if (!filter) return true;
  const id = articleCategory || '-';
  return id === filter || (filter !== '-' && byId('categories',id)?.parent_id === filter);
}

// Posició de la categoria en l'ordre triat a la pantalla Categories (el servidor ja les envia ordenades).
// «Sense categoria» (o una que ja no existeix) va al final.
function categoryRank(id) {
  const index = categoryTree().findIndex(item => item.id === id);
  return index < 0 ? Infinity : index;
}

function orderListRow(article,line,index) {
  const name = escape(article.name);
  const id = escape(article.id);
  const suppliers = data.offers.filter(offer => offer.article_id === article.id)
    .map(offer => byId('suppliers',offer.supplier_id)).filter(Boolean);
  const supplier = line ? byId('suppliers',line.supplier)?.name : suppliers.filter(item => !orderSupplier || item.id === orderSupplier).map(item => item.name).join(' · ');
  const detail = line
    ? quantityFormat.format(line.quantity)+' × '+(byId('units',line.unit)?.name || '')+' · '+(supplier || '')
    : articleDetail(article,orderSupplier);
  const toggle = line ? 'data-remove="'+index+'"' : 'data-mark-article="'+id+'"';
  const pencil = '<span aria-hidden="true">✎</span>';
  return '<div class="order-list-row'+(line ? ' is-ordered' : '')+'">'+
    '<button type="button" class="order-toggle" '+toggle+' aria-pressed="'+Boolean(line)+'" title="'+name+'">'+
    '<span class="order-marker" aria-hidden="true">'+(line ? '✓' : '')+'</span><span class="order-item-copy">'+
    '<strong>'+name+'</strong><span class="meta">'+escape(detail)+'</span></span></button>'+
    (line ? '<span class="order-steps"><button type="button" class="order-step" data-step="1" data-step-index="'+index+'" aria-label="Puja la quantitat de '+name+'">▲</button>'+
      '<button type="button" class="order-step" data-step="-1" data-step-index="'+index+'" aria-label="Baixa la quantitat de '+name+'">▼</button></span>' : '')+
    '<button type="button" class="order-pencil" data-order-editor="'+id+'" data-order-index="'+(line ? index : '')+
    '" aria-haspopup="dialog" aria-label="Fitxa de '+name+'">'+pencil+'</button></div>';
}

// Fitxa de l'article (llapis): línia de la comanda, dades de l'article i proveïdors, tot en un sol diàleg.
let sheetId = '';
let sheetAddToOrder = '';
let sheetFromTools = false;
function openOrderEditor(article, index, fromTools = false) {
  if (!article) return;
  sheetAddToOrder = '';
  sheetFromTools = fromTools;
  sheetId = article.id;
  edit = article.id;
  let dialog = document.querySelector('#order-dialog');
  // El diàleg viu fora del contingut perquè no es tanqui quan es torna a pintar la pantalla.
  if (!dialog) {
    dialog = document.createElement('dialog');
    dialog.id = 'order-dialog';
    dialog.setAttribute('aria-labelledby','order-dialog-title');
    dialog.addEventListener('close',() => { sheetId = ''; });
    document.querySelector('#workspace').append(dialog);
  }
  dialog.innerHTML = articleSheet(article, index);
  if (!dialog.open) dialog.showModal();
}

function refreshArticleSheet() {
  const dialog = document.querySelector('#order-dialog');
  const article = byId('articles',sheetId);
  if (!dialog?.open || !article) return;
  const index = data.draft.lines.findIndex(line => line.article === article.id);
  dialog.innerHTML = articleSheet(article, index < 0 ? '' : String(index));
}

function articleSheet(article, index) {
  const line = index === '' ? null : data.draft.lines[Number(index)];
  const offers = data.offers.filter(offer => offer.article_id === article.id);
  const suppliers = offers.map(offer => byId('suppliers',offer.supplier_id)).filter(Boolean);
  const defaults = orderDefaults(article);
  const name = escape(article.name);
  const id = escape(article.id);
  const used = data.draft.lines.some(item => item.article === article.id) || data.lines.some(item => item.article_id === article.id);
  // La unitat és una sola: la de la fitxa de l'article (si es canvia, es desa a la fitxa).
  // Tots els camps són del formulari «article-sheet» i es desen amb el botó «Desa» del final.
  const orderPart = article.archived ? '<p class="meta">Article arxivat. Restaura’l per poder-lo demanar.</p>' :
    suppliers.length ? '<div class="grid">'+
      '<label>Quantitat<input form="article-sheet" name="quantity" type="number" min="0" step="any" inputmode="decimal"'+(line ? ' required' : '')+' value="'+escape(line?.quantity ?? '')+'"'+(line ? '' : ' placeholder="No és a la comanda"')+'></label>'+
      '<label>Proveïdor<select form="article-sheet" name="supplier"'+(line ? ' required' : '')+'>'+options(suppliers,line?.supplier || defaults.supplier,'Tria un proveïdor')+'</select></label></div>'+
      (line ? '' : '<p class="meta">Escriu una quantitat si el vols afegir a la comanda.</p>')
    : '<p class="meta">Per demanar-lo, tria-li un proveïdor a sota i desa.</p>';
  return '<div class="sheet-head"><h2 id="order-dialog-title">'+name+'</h2><button type="button" id="close-order-dialog" aria-label="Tanca">✕</button></div>'+
    (sheetFromTools ? '' : '<section class="sheet-part"><h3>A la comanda</h3>'+orderPart+'</section>')+
    '<section class="sheet-part"><h3>Fitxa de l’article</h3><form id="article-sheet" data-line-index="'+(line ? index : '')+'">'+
      '<label class="sheet-name">Nom<input name="name" required maxlength="120" value="'+name+'"></label>'+
      '<div class="grid sheet-pair">'+
      '<label>Categoria<select name="category">'+categoryOptions(article.category_id,'Sense categoria')+'</select></label>'+
      '<label>Unitat<select name="unit" required>'+options(purchaseUnits(),line?.unit || article.unit_id,'Tria una unitat')+'</select></label></div>'+
      '<label class="sheet-name">Unitat de preu<select name="priceUnit">'+options(purchaseUnits(),article.price_unit_id || '','La mateixa que la de compra')+'</select></label>'+
      '<p class="meta">Per comparar preus. Ex.: el vi es compra a caixes però el preu que compta és per ampolla.</p>'+
      '</form></section>'+
    '<section class="sheet-part"><h3>Preus</h3>'+articlePrices(article)+'</section>'+
    '<section class="sheet-part"><h3>Proveïdors</h3>'+
      offers.map(offer => '<div class="row item"><span>'+escape(byId('suppliers',offer.supplier_id)?.name)+'</span>'+
        '<button type="button" class="remove" data-unlink="'+escape(offer.supplier_id)+'">Desvincula</button></div>').join('')+
      // El proveïdor triat aquí es desa amb el botó «Desa».
      (data.suppliers.length ? '<label>'+(offers.length ? 'Afegeix un proveïdor' : 'Proveïdor')+'<select form="article-sheet" name="offerSupplier">'+
        options(data.suppliers.filter(supplier => !offers.some(offer => offer.supplier_id === supplier.id)),'','Tria un proveïdor')+'</select></label>' :
        '<p class="meta">Encara no hi ha proveïdors. Crea’n un a Menú → Proveïdors.</p>')+
    '</section>'+
    '<section class="sheet-part"><h3>Últimes compres</h3>'+articlePurchases(article.id)+'</section>'+
    '<div class="actions sheet-foot"><button class="primary" form="article-sheet">Desa</button>'+
      // Arxivar només des de Menú → Articles.
      (sheetFromTools ? '<button type="button" data-archive-article="'+id+'">'+(article.archived ? 'Restaura' : 'Arxiva')+'</button>' : '')+
      (used ? '' : '<button type="button" class="remove" data-delete-article="'+id+'">Elimina</button>')+'</div>';
}

function orderDefaults(article) {
  const units = purchaseUnits();
  const offers = data.offers.filter(offer => offer.article_id === article.id && byId('suppliers',offer.supplier_id));
  const offer = offers.find(item => item.supplier_id === orderSupplier) ||
    offers.find(item => units.some(unit => unit.id === offerUnit(article,item))) || offers[0];
  const preferred = offerUnit(article,offer);
  return {
    supplier:offer?.supplier_id,
    unit:units.find(unit => unit.id === preferred)?.id || units[0]?.id
  };
}

// Situa el focus a la fila d'un article de la llista de Nova comanda i la remarca un moment.
function focusOrderArticle(id) {
  const pencil = [...document.querySelectorAll('#list-order [data-order-editor]')].find(item => item.dataset.orderEditor === id);
  const row = pencil?.closest('.order-list-row');
  if (!row) return;
  const group = row.closest('details');
  if (group && !group.open) group.open = true;
  row.scrollIntoView({block:'center',behavior:'smooth'});
  row.querySelector('.order-toggle')?.focus({preventScroll:true});
  row.classList.add('just-added');
  setTimeout(() => row.classList.remove('just-added'),2500);
}

// Després de marcar o desmarcar a Nova comanda, el focus es queda a la mateixa fila (sense desplaçar la pantalla).
function focusRowToggle(id) {
  const pencil = [...document.querySelectorAll('#list-order [data-order-editor]')].find(item => item.dataset.orderEditor === id);
  pencil?.closest('.order-list-row')?.querySelector('.order-toggle')?.focus({preventScroll:true});
}

async function pickOrderArticle(id, button) {
  if (busy) return;
  const article = byId('articles',id);
  if (!article) return;
  const {supplier,unit} = orderDefaults(article);
  // Article amb més d'un proveïdor (i sense filtre de proveïdor): es pregunta a qui es demana.
  const suppliers = orderSuppliers(article);
  if (unit && !orderSupplier && suppliers.length > 1) {
    openSupplierChoice(article,suppliers,Boolean(orderSearch.trim()));
    return;
  }
  if (!supplier || !unit) {
    // Li falta proveïdor o unitat: s'obre la fitxa i, en desar-la, s'afegeix a la comanda.
    openOrderEditor(article,'');
    sheetAddToOrder = article.id;
    return;
  }
  await addDraftLine({article:id,supplier,unit,quantity:1},button);
}

function orderSuppliers(article) {
  return data.offers.filter(offer => offer.article_id === article.id)
    .map(offer => byId('suppliers',offer.supplier_id)).filter(Boolean).sort(byName);
}

// Diàleg «A qui ho demanem?»: un botó per proveïdor; en prémer-ne un, l'article s'afegeix a la comanda amb aquest proveïdor.
function openSupplierChoice(article, suppliers, searched) {
  let dialog = document.querySelector('#order-dialog');
  if (!dialog) {
    dialog = document.createElement('dialog');
    dialog.id = 'order-dialog';
    dialog.setAttribute('aria-labelledby','order-dialog-title');
    dialog.addEventListener('close',() => { sheetId = ''; });
    document.querySelector('#workspace').append(dialog);
  }
  sheetId = '';
  const id = escape(article.id);
  dialog.innerHTML = '<div class="sheet-head"><h2 id="order-dialog-title">'+escape(article.name)+'</h2><button type="button" id="close-order-dialog" aria-label="Tanca">✕</button></div>'+
    '<p class="meta">A quin proveïdor ho demanem?</p><div class="supplier-choice">'+
    suppliers.map(supplier => '<button type="button" data-choose-supplier="'+escape(supplier.id)+'" data-choose-article="'+id+'"'+(searched ? ' data-choose-searched' : '')+'>'+escape(supplier.name)+'</button>').join('')+
    '</div>';
  if (!dialog.open) dialog.showModal();
  dialog.querySelector('[data-choose-supplier]')?.focus();
}

// «Desa i genera els missatges»: de quins proveïdors es fa la comanda (els altres es queden a «Nova comanda»).
function openGenerateChoice() {
  const counts = new Map();
  for (const line of data.draft.lines) counts.set(line.supplier,(counts.get(line.supplier) || 0)+1);
  const suppliers = [...counts.keys()].map(id => byId('suppliers',id)).filter(Boolean)
    .sort((a,b) => a.name.localeCompare(b.name,'ca',{sensitivity:'base'}));
  let dialog = document.querySelector('#order-dialog');
  if (!dialog) {
    dialog = document.createElement('dialog');
    dialog.id = 'order-dialog';
    dialog.setAttribute('aria-labelledby','order-dialog-title');
    dialog.addEventListener('close',() => { sheetId = ''; });
    document.querySelector('#workspace').append(dialog);
  }
  sheetId = '';
  dialog.innerHTML = '<div class="sheet-head"><h2 id="order-dialog-title">Genera la comanda</h2><button type="button" id="close-order-dialog" aria-label="Tanca">✕</button></div>'+
    '<section class="sheet-part"><h3>De quins proveïdors?</h3><p class="meta">Els articles dels proveïdors que no triïs es quedaran a «Nova comanda».</p>'+
    '<div class="generate-choice">'+suppliers.map(supplier => {
      const count = counts.get(supplier.id);
      return '<label><input type="checkbox" name="generate-supplier" value="'+escape(supplier.id)+'"'+(suppliers.length === 1 ? ' checked' : '')+'> '+
        escape(supplier.name)+' <span class="meta">('+count+(count === 1 ? ' article' : ' articles')+')</span></label>';
    }).join('')+'</div></section>'+
    '<div class="actions sheet-foot"><button type="button" class="primary" id="generate-selected">Desa i genera els missatges</button></div>';
  if (!dialog.open) dialog.showModal();
  dialog.querySelector('[name="generate-supplier"]')?.focus();
}

// L'esborrany canvia a la pantalla de seguida i es desa al servidor en segon pla (sense tornar a carregar totes les dades).
let draftPending = null;
let draftSending = null;
// «Nova comanda» és compartida: si mentrestant algú altre l'ha canviat (409), no es perd el canvi propi.
// Cada canvi es guarda com a operacions (afegeix/canvia/treu una línia) i, si hi ha conflicte,
// s'apliquen sobre la versió del servidor i es torna a desar.
let draftOps = [];
let draftEdits = 0;
const draftKey = line => JSON.stringify([line.article,line.supplier,line.unit]);
function draftDiff(before, after) {
  const old = new Map(before.map(line => [draftKey(line),line]));
  const now = new Map(after.map(line => [draftKey(line),line]));
  const ops = [];
  for (const [key,line] of now) if (!old.has(key) || old.get(key).quantity !== line.quantity) ops.push({key,line});
  for (const key of old.keys()) if (!now.has(key)) ops.push({key,line:null});
  return ops;
}
function applyDraftOps(lines, ops) {
  const result = new Map(lines.map(line => [draftKey(line),line]));
  for (const {key,line} of ops) {
    if (line) result.set(key,{...line}); else result.delete(key);
  }
  return [...result.values()];
}
function saveDraft(lines, button, message = '') {
  const combined = combineDraftLines(lines);
  draftOps.push(...draftDiff(data.draft.lines,combined));
  draftEdits += 1;
  data.draft.lines = combined;
  render();
  if (message) notify(message);
  draftPending = data.draft.lines;
  if (!draftSending) draftSending = sendDraft().finally(() => { draftSending = null; });
  return Promise.resolve();
}

async function sendDraft() {
  let failures = 0;
  let conflicts = 0;
  while (draftPending) {
    const lines = draftPending;
    const sentOps = draftOps.length;
    draftPending = null;
    setSync('Desant…');
    try {
      await api({action:'draft',lines,revision:data.draft.revision});
      data.draft.revision += 1;
      draftOps.splice(0,sentOps);
      failures = 0;
      conflicts = 0;
    } catch (error) {
      if (error.status === 409 && conflicts < 5) {
        // Algú altre ha canviat la comanda alhora: es pren la del servidor, s'hi tornen a aplicar
        // els canvis propis que encara no s'havien desat i es torna a desar (sense perdre res de ningú).
        conflicts += 1;
        try {
          const fresh = await api();
          data = fresh;
          data.draft.lines = combineDraftLines(applyDraftOps(fresh.draft.lines,draftOps));
          draftPending = draftOps.length ? data.draft.lines : null;
          if (!typing() && !document.querySelector('dialog[open]')) render();
          continue;
        } catch {
          draftPending = draftPending || lines;
          await new Promise(resolve => setTimeout(resolve,3000));
          continue;
        }
      }
      if (error.status >= 400 && error.status < 500) {
        data = await api().catch(() => data);
        draftOps = [];
        render();
        notify('No s’ha pogut desar l’últim canvi: '+error.message,true);
        draftPending = null;
        break;
      }
      // Sense connexió: es manté el canvi i es torna a provar.
      draftPending = draftPending || lines;
      failures += 1;
      setSync('Sense connexió · es tornarà a provar');
      await new Promise(resolve => setTimeout(resolve,Math.min(30000,3000*failures)));
    }
  }
  setSync(readyStatus);
}

// Espera que s'hagi desat l'esborrany (abans de generar la comanda).
async function flushDraft() {
  while (draftSending) await draftSending;
}
window.addEventListener('beforeunload',event => {

// ---- Lliscar per eliminar o arxivar, Desfés i Paperera (ESTIL.md) ----
// Cap a l'esquerra = eliminar (va a la Paperera 30 dies). Cap a la dreta = arxivar (o restaurar). Sense confirmació i amb Desfés.
const trashDays = 30;
const dayMs = 864e5;
// Fila lliscable: swipeOpen de shared/swipe.js.
function articleSwipe(article, rows) {
  if (data.permissions && !data.permissions.articles) return rows;
  return swipeOpen('article:'+article.id,true,true,article.archived ? 'restore' : 'archive')+'<div class="swipe-row">'+rows+'</div></div>';

function closeSheetOf(id) {

  if (addingArticle === id) addingArticle = '';
  mergeSelection.delete(id);
  if (sheetId === id) { sheetId = ''; document.querySelector('#order-dialog')?.close(); }
}
function deleteArticleNow(article, button) {
  return saveWithUndo({action:'deleteArticle',id:article.id},() => closeSheetOf(article.id),button,'S’ha eliminat «'+article.name+'».',
    result => save({action:'restoreTrash',ids:[result.trash]},null,null,() => 'S’ha recuperat «'+article.name+'».'));
}
function archiveArticleNow(article, button) {
  const archived = !article.archived;
  return saveWithUndo({action:'archiveArticle',id:article.id,archived},() => { if (edit === article.id) edit = ''; },button,
    'S’ha '+(archived ? 'arxivat' : 'restaurat')+' «'+article.name+'».',

const itemLabels = {supplier:'el proveïdor',category:'la categoria',unit:'la unitat',purchase:'l’albarà'};
function itemName(kind, id) {

    return purchase ? purchase.supplier_name+' ('+dayOf(purchase.date)+')' : '';
  }
  return byId({supplier:'suppliers',category:'categories',unit:'units'}[kind],id)?.name || '';
}
// Proveïdors, categories, unitats i albarans: sense confirmació i amb Desfés.
function deleteItemNow(kind, id, button) {
  const name = itemName(kind,id);
  return saveWithUndo({action:'deleteItem',kind,id},() => {
    if (kind === 'purchase' && openPurchase === id) openPurchase = '';
    if (kind === 'supplier' && supplierFilter === id) supplierFilter = '';

  },button,'S’ha eliminat '+itemLabels[kind]+' «'+name+'».',

}
function orderTitle(date) {
  return 'Comanda del '+dateFormat.format(new Date(date));
}
function deleteOrderNow(id, button) {
  const lines = data.lines.filter(line => line.order_id === id);
  if (!lines.length) return false;
  const title = orderTitle(lines[0].created_at);
  return saveWithUndo({action:'deleteOrder',id},() => { if (openOrder === id) openOrder = ''; },button,'S’ha eliminat la '+title.charAt(0).toLowerCase()+title.slice(1)+'.',
    result => save({action:'restoreTrash',ids:[result.trash]},null,null,() => 'S’ha recuperat la comanda.'));
}
function trashName(item) {
  return item.kind === 'order' ? orderTitle(item.name) : item.name;
}
const trashKinds = {article:'Article',order:'Comanda',supplier:'Proveïdor',category:'Categoria',unit:'Unitat',purchase:'Albarà'};
// A la Paperera: cap a la dreta es recupera (torna on era); cap a l'esquerra s'esborra definitivament. Tot amb Desfés.
function restoreTrashNow(item) {
  const name = trashName(item);
  return saveWithUndo({action:'restoreTrash',ids:[item.id]},null,null,'S’ha recuperat «'+name+'».',
    () => save(item.kind === 'order' ? {action:'deleteOrder',id:item.item_id} : item.kind === 'article' ? {action:'deleteArticle',id:item.item_id} :
      {action:'deleteItem',kind:item.kind,id:item.item_id},null,null,() => 'Ha tornat a la Paperera.'));
}
function purgeTrashNow(item) {
  const name = trashName(item);
  return saveWithUndo({action:'purgeTrash',ids:[item.id]},null,null,'S’ha esborrat definitivament «'+name+'».',
    () => save({action:'unpurgeTrash',ids:[item.id]},null,null,() => '«'+name+'» torna a ser a la Paperera.'));
}
function trashView() {
  const items = data.trash || [];
  const me = data.me?.email ?? '';
  const rows = items.map(item => {
    const left = Math.max(0,Math.ceil((Date.parse(item.deleted_at)+trashDays*dayMs-Date.now())/dayMs));
    const when = left <= 0 ? 's’esborrarà avui' : left === 1 ? 's’esborrarà demà' : 's’esborrarà d’aquí a '+left+' dies';
    const kind = trashKinds[item.kind] || '';
    const meta = [kind,item.detail,item.kind === 'order' && item.owner_email && item.owner_email !== me ? 'feta per '+authorName(item.owner_email) : '',
      'eliminat el '+new Date(item.deleted_at).toLocaleDateString('ca-ES',{dateStyle:'medium',timeZone:'Europe/Madrid'}),when].filter(Boolean).join(' · ');
    const name = trashName(item);
    return swipeOpen('trash:'+item.id,true,true,'restore')+'<div class="trash-row swipe-row" title="'+escape(name+' · '+meta)+'"><strong>'+escape(name)+'</strong>'+
      '<span class="meta">'+escape(meta)+'</span></div></div>';
  }).join('');
  return '<article class="card main-card"><h2>Paperera</h2><p class="meta">Llisca un element cap a la dreta per recuperar-lo o cap a l’esquerra per esborrar-lo definitivament. Passats '+trashDays+' dies, s’esborren sols.</p>'+
    '<div class="trash-list">'+(rows || empty('La paperera és buida.'))+'</div></article>';
}
async function swipeAction(key, dir) {
  const split = key.indexOf(':');
  const kind = key.slice(0,split);
  const id = key.slice(split+1);
  if (busy) return false;
  if (kind === 'article') {
    const article = byId('articles',id);
    return article ? (dir === 'left' ? deleteArticleNow(article) : archiveArticleNow(article)) : false;
  }
  if (kind === 'order') return deleteOrderNow(id);
  if (itemLabels[kind]) return deleteItemNow(kind,id);
  if (kind === 'trash') {
    const item = (data.trash || []).find(entry => entry.id === id);
    return item ? (dir === 'right' ? restoreTrashNow(item) : purgeTrashNow(item)) : false;
  }
  return false;
}

function fillContact(form, contact) {
  const phones = [...new Set((contact.tel || []).map(whatsappPhone).filter(Boolean))];

  const emailField = form.elements.email;

// Singular d'una unitat en català a partir del nom en plural (caixes → caixa, unitats → unitat).
// Només és una suggerència: a la fitxa de la unitat es pot escriure el singular correcte.
function guessSingular(name) {
  const [word, ...rest] = String(name ?? '').split(' ');
  const lower = word.toLocaleLowerCase('ca');
  let singular = word;
  if (word.length > 3 && lower.endsWith('s')) {
    if (/[tbd]res$/.test(lower)) singular = word.slice(0,-1);
    else if (lower.endsWith('ques')) singular = word.slice(0,-4)+'ca';
    else if (lower.endsWith('gues')) singular = word.slice(0,-4)+'ga';
    else if (lower.endsWith('ces')) singular = word.slice(0,-3)+'ça';
    else if (lower.endsWith('ges')) singular = word.slice(0,-3)+'ja';
    else if (lower.endsWith('ions')) singular = word.slice(0,-4)+'ió';
    else if (lower.endsWith('es')) singular = word.slice(0,-2)+'a';
    else singular = word.slice(0,-1);
  }
  return [singular,...rest].join(' ');
}

function unitLabel(unitName, quantity) {
  if (quantity !== 1) return unitName;
  const unit = data.units.find(item => item.name === unitName);
  return unit?.singular || guessSingular(unitName);
}

// «de» + nom de l'article, apostrofat davant de vocal o de h + vocal (d'oli, d'ous, d'herbes),
// però no davant de i/u que fan de consonant (de iogurt, de hielo).
// En minúscula (és un nom comú), tret que tingui altres majúscules: marques o sigles (Coca-Cola, IGP).
function ofArticle(name) {
  const raw = String(name ?? '').trim();
  const text = /\p{Lu}/u.test(raw.slice(1)) ? raw : raw.charAt(0).toLocaleLowerCase('ca')+raw.slice(1);
  const lower = text.toLocaleLowerCase('ca');
  const vowel = /^h?[aàeèéiíïoòóuúü]/.test(lower) && !/^h?[iu][aàeèéiíoòóuú]/.test(lower);
  return (vowel ? 'd’' : 'de ')+text;
}

function supplierMessage(lines, current, recipient) {
  const supplier = lines[0];
  // Agrupats per categoria (en l'ordre de la pantalla Categories, «Sense categoria» al final), articles en ordre alfabètic
  // i una línia en blanc entre categories.
  const sort = (a,b) => a.localeCompare(b,'ca',{sensitivity:'base'});
  const categories = Map.groupBy(lines,line => byId('articles',line.article_id)?.category_id || '');
  const articles = [...categories].sort(([a],[b]) => categoryRank(a)-categoryRank(b))
    .map(([, items]) => [...items].sort((a,b) => sort(a.article,b.article))
      .map(line => '• '+quantityFormat.format(line.quantity)+' '+unitLabel(line.unit,Number(line.quantity))+' '+ofArticle(line.article)).join('\n'))
    .join('\n\n');
  const contact = recipient || current?.contact || supplier.contact;
  const template = supplier.message_template ?? current?.message_template;
  const hello = contact ? 'Bon dia, '+contact+'!' : 'Bon dia!';
  if (!template) return hello+' Us voldríem fer aquesta comanda:\n\n'+articles+'\n\nGràcies!';
  const values = {comercial:contact || supplier.supplier,proveidor:supplier.supplier,articles};
  const text = template.replace(/\{(comercial|proveidor|articles)\}/g,(_, key) => values[key]);
  return template.includes('{articles}') ? text : text+'\n\n'+articles;
}

    (!phone && current ? '<a href="'+escape(whatsappLink('',message))+'">Tria dins de WhatsApp</a>' : '')+'</div>'+chooser+'</section>';
}

async function openOrderRecipient(form, button) {
  if (busy) return;
  const phone = whatsappPhone(form.elements.phone.value);
  if (!phone) {
    notify('Indica un número de WhatsApp amb el prefix internacional.',true);
    form.elements.phone.focus();
    return;
  }
  const supplier = byId('suppliers',form.dataset.supplierId);
  const lines = data.lines.filter(line => line.order_id === form.dataset.orderId && line.supplier_id === supplier?.id);
  if (!lines.length) return;
  const contact = form.elements.contact.value.trim();
  const link = whatsappLink(phone,supplierMessage(lines,supplier,contact));

    let saved = false;
    await save({action:'assignSupplierContact',id:supplier.id,phone,contact},() => {saved = true;},button,()=>'Contacte desat per a les properes comandes.');
    if (!saved) return;
  }
  location.assign(link);
}


// ---- Albarans i compres ----
const moneyFormat = new Intl.NumberFormat('ca-ES',{style:'currency',currency:'EUR'});
const dayFormat = new Intl.DateTimeFormat('ca-ES',{dateStyle:'medium',timeZone:'UTC'});
const dayOf = date => dayFormat.format(new Date(date+'T00:00:00Z'));

// Article que més s'assembla al text de l'albarà (si n'hi ha un de clar).
function guessArticle(name) {
  const words = searchKey(name).replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(word => word.length >= 3);
  if (!words.length) return '';
  let best = null, bestScore = 0;
  for (const article of data.articles.filter(item => !item.archived)) {
    const key = searchKey(article.name);
    const own = key.replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(word => word.length >= 3);
    if (!own.length) continue;
    const hits = own.filter(word => words.some(other => other.startsWith(word) || word.startsWith(other))).length;
    const score = hits / own.length;
    if (score > bestScore) { best = article; bestScore = score; }
  }
  return bestScore >= .99 ? best.id : '';
}

async function fileToBase64(file) {
  // Les fotos grans es redueixen (màx. 2200 px) perquè la lectura sigui ràpida.
  if (file.type.startsWith('image/') && file.size > 1_500_000) {
    try {
      const url = URL.createObjectURL(file);
      const image = new Image();
      image.src = url;
      await image.decode();
      const scale = Math.min(1,2200/Math.max(image.naturalWidth,image.naturalHeight));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(image.naturalWidth*scale);
      canvas.height = Math.round(image.naturalHeight*scale);
      canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);
      URL.revokeObjectURL(url);
      return {image:canvas.toDataURL('image/jpeg',.85).split(',')[1], mimeType:'image/jpeg'};
    } catch {
      // Si no es pot reduir, s'envia tal com és.
    }
  }
  const bytes = new Uint8Array(await file.arrayBuffer());
  let binary = '';
  for (let i = 0; i < bytes.length; i += 32768) binary += String.fromCharCode(...bytes.subarray(i,i+32768));
  return {image:btoa(binary), mimeType:file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf') ? 'application/pdf' : file.type};
}

// Unitat de preu proposada: la de l'article; per a un article nou, kg si l'albarà en porta el pes, o la de l'albarà.
function defaultPriceUnit(row, articleId) {
  const article = byId('articles',articleId);
  if (article) return article.price_unit_id || article.unit_id || '';
  const kg = purchaseUnits().find(item => item.id === 'kg' || unitMatches('kg',item));
  return row.kg > 0 && kg ? kg.id : row.unitId || '';
}

// Converteix la resposta de la IA en una revisió (amb l'article proposat per a cada línia).
function makeReview(result, fileName) {
  return {...result, files:[fileName], rows:result.rows.map(row => {
    const known = row.articleId && byId('articles',row.articleId) ? row.articleId : '';
    const articleId = known || guessArticle(row.name);
    const source = known ? row.matchSource || 'previous' : articleId ? 'name' : '';
    // Si no existeix, es proposa crear-lo amb el nom que suggereix la IA (o el de l'albarà).
    const newName = articleId ? '' : (row.suggestedName || row.name);
    // La unitat es tria d'entre les del catàleg: es proposa la que correspon al text de l'albarà.
    // Si l'albarà diu una unitat que no és al catàleg (ex.: «BU»), es proposa la de compra de l'article.
    const unit = purchaseUnits().find(item => unitMatches(row.unit,item)) || byId('units',byId('articles',articleId)?.unit_id);
    const review = {...row, articleId, newName, unitRead:row.unit, unitId:unit?.id ?? '', unit:unit?.name ?? '',
      toStock:row.fish, discard:false, suggestion:{articleId, newName, source}};
    review.priceUnitId = defaultPriceUnit(review,articleId);
    return review;
  })};
}

// Els fulls d'un mateix albarà (mateix proveïdor i número, o un full sense número del mateix proveïdor i data) s'ajunten.
function sameInvoice(a, b) {
  const supplier = item => item.supplierId || searchKey(item.supplierName || '');
  if (!supplier(a) || supplier(a) !== supplier(b)) return false;
  const number = item => searchKey(item.invoiceNumber || '').replace(/[^a-z0-9]/g,'');
  if (number(a) && number(b)) return number(a) === number(b);
  return !!a.date && a.date === b.date;
}
function mergeReviews(reviews) {
  const merged = [];
  for (const review of reviews) {
    const into = merged.find(item => sameInvoice(item,review));
    if (!into) { merged.push(review); continue; }
    // El full amb número d'albarà sol ser el primer: les seves línies van davant.
    const first = !into.invoiceNumber && review.invoiceNumber;
    into.rows = first ? [...review.rows, ...into.rows] : [...into.rows, ...review.rows];
    into.files = first ? [...review.files, ...into.files] : [...into.files, ...review.files];
    into.warnings = [...new Set([...into.warnings, ...review.warnings])];
    into.invoiceNumber ||= review.invoiceNumber;
    into.date ||= review.date;
    into.dateText ||= review.dateText;
  }
  // Ordre: per data i proveïdor.
  return merged.sort((a,b) => (a.date || '9').localeCompare(b.date || '9') || (a.supplierName || '').localeCompare(b.supplierName || '','ca'))
    .map((review,i) => ({...review, position:i}));
}

function showNextInvoice() {
  invoiceReview = invoiceQueue.shift() ?? null;
  duplicateAllowed = false;
  window.scrollTo({top:0});
}

async function readPurchase(form, button) {
  const files = [...form.elements.file.files];
  if (!files.length || busy) return;
  if (files.length > 20) { notify('Tria com a màxim 20 fitxers de cop.',true); return; }
  const big = files.find(file => file.size > 8*1024*1024 && !file.type.startsWith('image/'));
  if (big) { notify('«'+big.name+'» fa més de 8 MB.',true); return; }
  busy = true;
  readingInvoice = true;
  let done = 0;
  readProgress = files.length > 1 ? '(0 de '+files.length+')' : '';
  render();
  notify('Llegint '+(files.length > 1 ? files.length+' fitxers' : 'l’albarà')+' amb IA… pot trigar uns segons.');
  const results = new Array(files.length), failed = [];
  // Es llegeixen de 3 en 3 perquè vagi més de pressa sense saturar el servidor.
  let next = 0;
  const worker = async () => {
    while (next < files.length) {
      const i = next++;
      try {
        results[i] = makeReview(await api({action:'readInvoice',...await fileToBase64(files[i])}),files[i].name);
      } catch (error) {
        failed.push(files[i].name+': '+error.message);
      }
      done++;
      if (files.length > 1) {
        readProgress = '('+done+' de '+files.length+')';
        const label = document.querySelector('#read-purchase button');
        if (label) label.textContent = 'Llegint els albarans… '+readProgress;
      }
    }
  };
  try {
    await Promise.all(Array.from({length:Math.min(3,files.length)},worker));
    const reviews = mergeReviews(results.filter(Boolean).filter(review => review.rows.length || review.supplierName));
    // Còpia: la cua es va buidant a mesura que es revisen.
    invoiceQueue = [...reviews];
    showNextInvoice();
    const lines = reviews.reduce((sum,review) => sum+review.rows.length,0);
    if (failed.length) notify('No s’han pogut llegir: '+failed.join(' · '),true);
    else if (!reviews.length || !lines) notify('No s’ha trobat cap línia als albarans.',true);
    else notify(reviews.length > 1 ? 'S’han llegit '+reviews.length+' albarans. Revisa’ls un per un.' : 'Revisa les línies i desa la compra.');
  } finally {
    busy = false;
    readingInvoice = false;
    readProgress = '';
    render();
  }
}

async function savePurchaseReview(form, button) {
  syncInvoiceReview(form);
  const review = invoiceReview;
  const kept = review.rows.filter(row => !row.discard);
  if (!kept.length) { notify('Totes les línies estan descartades. Cancel·la la lectura o recupera’n alguna.',true); return; }
  const missing = kept.findIndex(row => !row.articleId && !row.newName);
  if (missing >= 0) { notify('A la línia «'+kept[missing].name+'» li falta l’article.',true); return; }
  const noUnit = kept.find(row => !row.unitId);
  if (noUnit) { notify('A la línia «'+noUnit.name+'» li falta la unitat.',true); form.elements['unit-'+review.rows.indexOf(noUnit)]?.focus(); return; }
  const noPriceUnit = kept.find(row => !rowPriceUnit(row));
  if (noPriceUnit) { notify('A la línia «'+noPriceUnit.name+'» li falta la unitat de preu.',true); form.elements['priceunit-'+review.rows.indexOf(noPriceUnit)]?.focus(); return; }
  // Sense quantitat en la unitat de preu no se'n sap el cost: s'avisa abans de desar.
  const noQuantity = kept.filter(row => !rowPriceQuantity(row));
  if (noQuantity.length && !window.confirm('No se’n podrà saber el cost (falta la quantitat o la conversió): '+noQuantity.map(row => row.name).join(', ')+'. Vols desar igualment?')) return;
  const payload = {action:'savePurchase', supplierId:review.supplierId, supplierName:review.supplierId ? '' : review.supplierName,
    date:review.date, invoiceNumber:review.invoiceNumber.trim(), force:duplicateAllowed,
    lines:kept.map(row => ({articleId:row.articleId, newArticle:row.newName, name:row.name, quantity:row.quantity, unit:row.unit, unitId:row.unitId,
      unitPrice:row.unitPrice, total:row.total, kg:row.kg, units:row.units, toStock:row.toStock,
      priceUnitId:rowPriceUnit(row)?.id ?? '', priceQuantity:rowPriceQuantity(row)}))};
  let saved;
  try {
    saved = await api(payload);
  } catch (error) {
    if (error.status === 409 && /ja s’havia desat/.test(error.message)) duplicateAllowed = true;
    notify(error.message,true);
    return;
  }
  const sent = kept.filter(row => row.toStock).length;
  data = await api();
  // Els articles nous que s'acaben de crear ja surten reconeguts als albarans que falten.
  for (const pending of invoiceQueue) for (const row of pending.rows) {
    if (!row.articleId && row.newName) {
      const match = data.articles.find(item => searchKey(item.name) === searchKey(row.newName));
      if (match) { row.articleId = match.id; row.newName = ''; row.suggestion = {articleId:match.id, newName:'', source:'name'}; }
    }
  }
  showNextInvoice();
  render();
  const changes = costChangesText(saved?.costChanges);
  notify('Albarà desat.'+(sent ? ' '+sent+(sent === 1 ? ' línia enviada' : ' línies enviades')+' a GestoStock.' : '')+
    (invoiceReview ? ' Ara revisa el següent.' : '')+changes,false,Boolean(changes));
}

// Plats de GestoStock que canvien de cost amb l'albarà desat (el servidor els calcula amb l'últim preu de cada article).
function costChangesText(changes) {
  if (!Array.isArray(changes) || !changes.length) return '';
  const pct = value => value == null ? '' : Math.round(value)+'%';
  const list = changes.slice(0,4).map(item => item.nom+' '+(item.after > item.before ? '+' : '−')+moneyFormat.format(Math.abs(item.after-item.before))+
    (item.pctBefore != null ? ' ('+pct(item.pctBefore)+' → '+pct(item.pctAfter)+' de cost)' : ' ('+moneyFormat.format(item.after)+')')).join('; ');
  return ' Canvia el cost '+(changes.length === 1 ? 'd’un plat' : 'de '+changes.length+' plats')+': '+list+(changes.length > 4 ? ' i '+(changes.length-4)+' més' : '')+'. Ho veuràs a GestoStock → Plats i escandalls.';
}

// ---- Preus per unitat de preu ----
// Unitat en què es compara el preu (ex.: ampolla). Buida a la fitxa = la unitat de compra.
function priceUnitOf(article) {
  return byId('units',article?.price_unit_id || article?.unit_id);
}
// El text d'una unitat de l'albarà correspon a una unitat del catàleg? (caixes/caixa, kg/kilos, u/uds/unitats…)
const unitAliases = {kg:['kg','kgs','kilo','kilos','quilo','quilos','kilogram','kilograms'],unit:['u','ud','uds','un','unitat','unitats','unidad','unidades','pc','pcs','pz','pza','pieza','piezas','peca','peces'],
  box:['bu','bulto','bultos','caixa','caixes','caja','cajas','cj','cjs']};
function unitMatches(text, unit) {
  const key = searchKey(String(text ?? '')).replace(/\.$/,'');
  if (!key || !unit) return false;
  const names = [unit.name, unit.singular, guessSingular(unit.name)].filter(Boolean).map(searchKey);
  return names.includes(key) || (unitAliases[unit.id] || []).includes(key) ||
    Object.values(unitAliases).some(list => list.includes(key) && list.some(alias => names.includes(alias)));
}
const priceOf = line => line.total !== null && line.total !== undefined ? line.total :
  line.unitPrice !== null && line.unitPrice !== undefined && line.quantity !== null ? line.unitPrice*line.quantity : null;
// ---- Unitat de preu de cada línia de l'albarà ----
// La unitat de preu triada a la revisió; si no, la de l'article (o la de compra, si no en té).
function rowPriceUnit(row) {
  return byId('units',row.priceUnitId) || priceUnitOf(byId('articles',row.articleId));
}
const capital = text => text.charAt(0).toLocaleUpperCase('ca')+text.slice(1);
const singularOf = unit => unit.singular || guessSingular(unit.name);
// Com es passa la quantitat de l'albarà a la unitat de preu:
// same: és la mateixa; mul: «Kg per caixa» (caixes × kg per caixa); div: l'albarà ve en kg i el preu és per caixa (kg ÷ kg per caixa).
function priceConversion(row) {
  const unit = rowPriceUnit(row);
  const line = byId('units',row.unitId);
  if (!unit || !line || unit.id === line.id) return {mode:'same', unit, line};
  const isKg = item => item.id === 'kg' || unitMatches('kg',item);
  if (!isKg(unit) && isKg(line)) return {mode:'div', unit, line, label:capital(line.name)+' per '+singularOf(unit)};
  return {mode:'mul', unit, line, label:capital(unit.name)+' per '+singularOf(line)};
}
function defaultPerPack(row, conversion) {
  if (!row.quantity) return null;
  const {mode, unit} = conversion;
  if (mode === 'mul' && unitMatches('kg',unit) && row.kg) return Number((row.kg/row.quantity).toPrecision(6));
  if (mode === 'mul' && row.units) return Number((row.units/row.quantity).toPrecision(6));
  if (mode === 'div' && row.units) return Number((row.quantity/row.units).toPrecision(6));
  return null;
}
// Quantitat comprada en la unitat de preu (ex.: 6 kg). És la base del cost.
function rowPriceQuantity(row) {
  const conversion = priceConversion(row);
  if (!conversion.unit || !(row.quantity > 0)) return null;
  if (conversion.mode === 'same') return row.quantity;
  const perPack = row.perPack ?? defaultPerPack(row,conversion);
  if (!(perPack > 0)) return null;
  return Number((conversion.mode === 'mul' ? perPack*row.quantity : row.quantity/perPack).toPrecision(12));
}
const unitShort = unit => unitLabel(unit.name,1);
const amountFormat = new Intl.NumberFormat('ca-ES',{maximumFractionDigits:3});
function priceRowText(row) {
  const unit = rowPriceUnit(row);
  if (!unit) return 'Tria la unitat de preu per poder saber el cost.';
  const quantity = rowPriceQuantity(row);
  const total = priceOf(row);
  if (!quantity) return 'Falta la quantitat'+(priceConversion(row).mode === 'same' ? '' : ' o la conversió')+' per saber quant '+escape(unit.name)+' s’han comprat.';
  const bought = 'Comprat: <strong>'+amountFormat.format(quantity)+' '+escape(unitLabel(unit.name,quantity))+'</strong>';
  return total === null ? bought+' · falta l’import per saber el cost.' : bought+' · Cost: <strong>'+moneyFormat.format(total/quantity)+'/'+escape(unitShort(unit))+'</strong>';
}
function priceRow(row, i) {
  if (row.discard || (!row.articleId && !row.newName)) return '';
  const article = byId('articles',row.articleId);
  const current = article ? (article.price_unit_id || article.unit_id || '') : '';
  const chosen = row.priceUnitId ?? current;
  const select = '<label>Unitat de preu (cost)<select name="priceunit-'+i+'">'+options(purchaseUnits(),chosen,'Tria la unitat de preu')+'</select></label>';
  const conversion = priceConversion(row);
  const field = conversion.mode === 'same' || !conversion.unit ? '' :
    '<label>'+escape(conversion.label)+'<input name="pack-'+i+'" type="number" min="0" step="any" inputmode="decimal" value="'+escape(row.perPack ?? defaultPerPack(row,conversion) ?? '')+'" placeholder="Ex.: 6"></label>';
  const change = article && chosen && chosen !== current ?
    '<p class="meta">En desar, la unitat de preu de «'+escape(article.name)+'» passarà a ser «'+escape(byId('units',chosen)?.name || '')+'»'+(current ? ' (les compres antigues en «'+escape(byId('units',current)?.name || '')+'» deixaran de comptar a les mitjanes)' : '')+'.</p>' : '';
  return select+field+'<p class="meta purchase-cost" data-price-text="'+i+'">'+priceRowText(row)+'</p>'+change;
}

// Dades de preu d'un article (fitxa): últim preu, mitjanes ponderades, mínim i màxim i per proveïdor.
function articlePrices(article) {
  const unit = priceUnitOf(article);
  if (!unit) return '<p class="meta">Tria la unitat de l’article per poder-ne guardar els preus.</p>';
  const all = (data.priceLines || []).filter(line => line.article_id === article.id);
  const lines = all.filter(line => line.unit_id === unit.id);
  const other = all.length > lines.length ? '<p class="meta">Hi ha compres desades en una altra unitat de preu: no es compten.</p>' : '';
  if (!lines.length) return '<p class="meta">Encara no hi ha preus per '+escape(unitShort(unit))+'. Sortiran en desar albarans.</p>'+other;
  const per = ' €/'+unitShort(unit);
  const price = value => moneyFormat.format(value).replace(/\s?€$/,'')+per;
  const since = days => orderKeyFormat.format(new Date(Date.now()-days*864e5));
  const average = items => items.reduce((sum,line) => sum+line.total,0)/items.reduce((sum,line) => sum+line.quantity,0);
  const count = items => items.length+(items.length === 1 ? ' compra' : ' compres');
  const last = lines[0];
  const month = lines.filter(line => line.date >= since(30));
  const year = lines.filter(line => line.date >= since(365));
  const each = year.map(line => line.total/line.quantity);
  const bySupplier = Map.groupBy(year,line => line.supplier_name || 'Sense proveïdor');
  const rows = [
    ['Últim preu', price(last.total/last.quantity), dayOf(last.date)+(last.supplier_name ? ' · '+last.supplier_name : '')],
    ['Mitjana de l’últim mes', month.length ? price(average(month)) : '—', month.length ? count(month) : 'Cap compra'],
    ['Mitjana de l’últim any', year.length ? price(average(year)) : '—', year.length ? count(year) : 'Cap compra'],
    ...(year.length > 1 ? [['Mínim i màxim de l’any', price(Math.min(...each))+' – '+price(Math.max(...each)), '']] : [])
  ];
  return '<dl class="price-stats">'+rows.map(([label,value,note]) => '<div><dt>'+escape(label)+'</dt><dd><strong>'+escape(value)+'</strong>'+
      (note ? '<span class="meta">'+escape(note)+'</span>' : '')+'</dd></div>').join('')+'</dl>'+
    (bySupplier.size > 1 ? '<p class="meta">Mitjana de l’any per proveïdor: '+[...bySupplier].map(([name,items]) => escape(name)+' '+escape(price(average(items)))).join(' · ')+'</p>' : '')+other;
}

// Últimes compres d'un article (per a la fitxa).
function articlePurchases(articleId) {
  const purchases = new Map((data.purchases || []).map(item => [item.id,item]));
  const lines = (data.purchaseLines || []).filter(line => line.article_id === articleId && purchases.has(line.purchase_id))
    .sort((a,b) => purchases.get(b.purchase_id).date.localeCompare(purchases.get(a.purchase_id).date)).slice(0,10);
  if (!lines.length) return '<p class="meta">Encara no hi ha compres d’aquest article.</p>';
  return lines.map(line => {
    const purchase = purchases.get(line.purchase_id);
    return '<div class="item purchase-line"><strong>'+escape(dayOf(purchase.date))+'</strong> · '+escape(purchase.supplier_name)+
      '<div class="meta">'+[line.quantity !== null ? quantityFormat.format(line.quantity)+' '+escape(line.unit) : '',
        line.unit_price !== null ? moneyFormat.format(line.unit_price)+(line.unit ? '/'+escape(guessSingular(line.unit)) : '') : '',
        line.total !== null ? 'Import '+moneyFormat.format(line.total) : '',
        line.price_quantity > 0 && byId('units',line.price_unit_id) && priceOf({total:line.total,unitPrice:line.unit_price,quantity:line.quantity}) !== null
          ? moneyFormat.format(priceOf({total:line.total,unitPrice:line.unit_price,quantity:line.quantity})/line.price_quantity)+'/'+escape(unitShort(byId('units',line.price_unit_id))) : ''].filter(Boolean).join(' · ')+'</div></div>';
  }).join('');
}

function purchasesView() {
  const lines = Map.groupBy(data.purchaseLines || [],line => line.purchase_id);
  const stockLabel = {pending:'Pendent a GestoStock', done:'Partida creada', discarded:'Descartada a GestoStock'};
  return '<article class="card main-card"><h2>Albarans</h2>'+invoiceCard()+
    (invoiceReview ? '' : '<section class="card"><h3>Albarans desats</h3>'+((data.purchases || []).length ? '<p class="meta">Llisca un albarà cap a l’esquerra per eliminar-lo.</p>' : '')+((data.purchases || []).map(purchase => {
      const items = lines.get(purchase.id) || [];
      const total = items.reduce((sum,line) => sum+(line.total ?? 0),0);
      return swipeOpen('purchase:'+purchase.id,true,false)+'<div class="item swipe-row"><button type="button" class="purchase-head" data-purchase="'+escape(purchase.id)+'" aria-expanded="'+(openPurchase === purchase.id)+'">'+
        '<strong>'+escape(dayOf(purchase.date))+' · '+escape(purchase.supplier_name)+'</strong>'+
        '<span class="meta">'+(purchase.invoice_number ? 'Albarà '+escape(purchase.invoice_number)+' · ' : '')+items.length+(items.length === 1 ? ' línia' : ' línies')+(total ? ' · '+moneyFormat.format(total) : '')+'</span></button>'+
        (openPurchase === purchase.id ? items.map(line => '<div class="item"><strong>'+escape(byId('articles',line.article_id)?.name || line.name)+'</strong>'+
          '<div class="meta">'+[escape(line.name), line.quantity !== null ? quantityFormat.format(line.quantity)+' '+escape(line.unit) : '',
            line.unit_price !== null ? moneyFormat.format(line.unit_price) : '', line.total !== null ? moneyFormat.format(line.total) : '',
            stockLabel[line.stock_status] || ''].filter(Boolean).join(' · ')+'</div>'+
          (line.stock_status === 'done' ? '' : '<button type="button" class="line-article" data-no-swipe data-fix-line="'+escape(purchase.id)+'" data-fix-position="'+line.position+'">Canvia l’article</button>')+
          '</div>').join('') : '')+'</div></div>';
    }).join('') || '<p class="meta">Encara no s’ha desat cap albarà.</p>')+'</section>')+'</article>';
}

document.addEventListener('input',event => {
  const form = event.target.form;
  const match = /^(article|quantity|unit|priceunit|price|total|pack)-(\d+)$/.exec(event.target.name || '');
  if (form?.id !== 'purchase-review' || !match) return;
  const i = Number(match[2]);
  const before = invoiceReview.rows[i]?.articleId;
  syncInvoiceReview(form);
  const row = invoiceReview.rows[i];
  if (match[1] === 'article') {
    const hint = form.querySelector('[data-article-hint="'+i+'"]');
    if (hint) hint.innerHTML = articleHint(row);
  }
  // Si canvia l'article o la unitat, es torna a pintar el camp «… per caixa»; si no, només el preu calculat.
  if (match[1] === 'article' || match[1] === 'unit' || match[1] === 'priceunit') {
    if (match[1] !== 'article' || before !== row.articleId) row.perPack = null;
    const box = form.querySelector('[data-price-row="'+i+'"]');
    if (box) box.innerHTML = priceRow(row,i);
  } else {
    const text = form.querySelector('[data-price-text="'+i+'"]');
    if (text) text.innerHTML = priceRowText(row);
  }
});

function render() {
  menuButton.hidden = false;
  // Només es mostren les opcions del menú que l'usuari té permeses a GestoAdmin.
  // La Paperera, a qui té alguna altra opció (hi veu el que pot veure a l'app).
  const allowed = Object.keys(sections).filter(key => !data?.permissions ||
    (key === 'trash' ? Object.keys(sections).some(item => item !== 'trash' && data.permissions[item]) : data.permissions[key]));
  if (!allowed.length) {
    tabs.innerHTML = '';
    content.innerHTML = '<section class="card main-card"><h2>Sense opcions</h2><p class="meta">Encara no tens cap opció de GestoCatalog. Demana a l’administrador que te’n doni.</p></section>';
    return;
  }
  if (!allowed.includes(section)) section = allowed[0];
  tabs.innerHTML = Object.entries(sections).filter(([key]) => allowed.includes(key)).map(([key,label]) => '<button data-tab="'+key+'" '+(section === key ? 'aria-current="page"' : '')+'>'+label+'</button>').join('');
  if (invoiceReview && section === 'purchases') syncInvoiceReview(document.querySelector('#purchase-review'));
  content.innerHTML = section === 'order' ? order() : section === 'articles' ? articlesView() : section === 'history' ? history() : section === 'purchases' ? purchasesView() : section === 'trash' ? trashView() :
    '<section class="card main-card"><h2>'+sections[section]+'</h2>'+catalog()+'</section>';
  refreshArticleSheet();
}

  if (!button || button.id === 'theme' || !data || busy) return;

  if (Object.hasOwn(target,'undo')) {
    // El botó «Desfés» ja el gestiona shared/swipe.js (showUndo).
  } else if (target.tab) {
    if (tabs.contains(button)) {
      setMenu(false);
      menuButton.focus();
    }

    section = target.tab;
    addingArticle = '';
    edit = '';
    notify('');
    render();

    pdfReview = null;
    notify('');
    render();
  } else if (target.browseArticles) {

    categoryFilter = section === 'categories' ? target.browseArticles : '';
    articleSearch = '';

    section = 'articles';

    search.scrollIntoView({block:'nearest'});
    search.focus();
  } else if (target.addArticle || Object.hasOwn(target,'closeLine')) {
    const article = target.addArticle || addingArticle;

    refreshCatalogRows();
    const line = document.querySelector('#catalog-line');
    if (line) (line.elements.supplier.value ? line.elements.quantity : line.elements.supplier).focus();
    else [...content.querySelectorAll('[data-add-article]')].find(item => item.dataset.addArticle === article)?.focus();
  } else if (button.id === 'article-archive-view') {
    archivedArticles = !archivedArticles;
    addingArticle = '';
    render();
    document.querySelector('#article-archive-view').focus();
  } else if (target.toggleGroups) {
    const scope = target.toggleGroups;
    const set = collapsedGroups[scope];
    if (set.size) set.clear();
    else document.querySelectorAll('details[data-group-scope="'+scope+'"]').forEach(group => set.add(group.dataset.groupCategory));
    saveCollapsedGroups();
    refreshGroups(scope);
  } else if (target.selectArticle) {
    // A Articles, prémer la fila la marca o la desmarca.
    if (mergeSelection.has(target.selectArticle)) mergeSelection.delete(target.selectArticle);
    else mergeSelection.add(target.selectArticle);
    refreshList('articles');
    document.querySelector('#article-merge-controls').innerHTML = articleMergeControls();
    const selectButton = document.querySelector('#select-visible-articles');
    if (selectButton) selectButton.textContent = selectVisibleLabel();
    [...document.querySelectorAll('[data-select-article]')].find(item => item.dataset.selectArticle === target.selectArticle)?.focus();
  } else if (button.id === 'select-visible-articles' && hasMarkedArticles()) {
    mergeSelection.clear();
    render();
    document.querySelector('#select-visible-articles')?.focus();
  } else if (button.id === 'select-visible-articles') {
    // Només els que es veuen: no compten els de categories replegades.
    [...content.querySelectorAll('[data-select-article]')].filter(item => !item.closest('details:not([open])')).forEach(item => mergeSelection.add(item.dataset.selectArticle));
    render();
  } else if (button.id === 'clear-bulk-log') {
    bulkLog.length = 0;
    document.querySelector('#article-merge-controls').innerHTML = articleMergeControls();
  } else if (target.deleteItem) {
    const split = target.deleteItem.indexOf(':');
    await deleteItemNow(target.deleteItem.slice(0,split),target.deleteItem.slice(split+1),button);
  } else if (target.archiveArticle || target.deleteArticle) {
    // Botons Arxiva i Elimina de la fitxa: sense confirmació i amb Desfés (ESTIL.md).
    const article = byId('articles',target.archiveArticle || target.deleteArticle);
    if (!article) return;
    if (target.deleteArticle) await deleteArticleNow(article,button);
    else await archiveArticleNow(article,button);
  } else if (target.edit || Object.hasOwn(target,'cancel')) {
    edit = target.edit || '';
    render();
    document.querySelector('#catalog input').focus();
    document.querySelector('#catalog').scrollIntoView({block:'nearest'});
  } else if (Object.hasOwn(target,'contactApply')) {
    const form = button.form;
    const input = form.querySelector('[data-contact-paste]');
    const fromShortcut = workerContactFromShortcut(input.value);
    const contact = fromShortcut ?? vCardContact(input.value.trim());
    if (!contact || !(contact.name || contact.tel?.length)) {
      notify('Enganxa el contacte copiat per la drecera Nexa Contacte 2.',true);
      return;
    }
    if (fromShortcut) markWorkerShortcutReady();
    if (fillContact(form,contact)) {
      input.value = '';
      form.querySelector('[data-contact-ios]').open = false;
    }
  } else if (Object.hasOwn(target,'pickContact')) {
    try {
      const wantsEmail = Boolean(button.form.elements.email);
      const [contact] = await navigator.contacts.select(wantsEmail ? ['name','tel','email'] : ['name','tel'],{multiple:false});
      if (contact && button.form.isConnected) fillContact(button.form,{name:contact.name?.[0],tel:contact.tel,email:contact.email});
    } catch (error) {
      if (error.name !== 'AbortError') notify('No s’ha pogut obrir l’agenda. Pots escriure el número al formulari.',true);
    }
  } else if (button.id === 'order-visibility') {
    // Només es refà la llista: així la cerca i els filtres es queden com estaven.
    onlyOrdered = !onlyOrdered;
    button.setAttribute('aria-pressed',String(onlyOrdered));
    refreshList('order');
  } else if (target.step) {
    const position = Number(target.stepIndex);
    const lines = data.draft.lines.map((line,i) => i === position ? {...line,quantity:Math.round((line.quantity+Number(target.step))*1000)/1000} : line)
      .filter(line => line.quantity > 0);
    await saveDraft(combineDraftLines(lines),button);
  } else if (target.pickRow) {
    openArticlePicker(Number(target.pickRow));
  } else if (target.pickArticle) {
    choosePickedArticle(target.pickArticle,'');
  } else if (target.pickNew) {
    choosePickedArticle('',target.pickNew);
  } else if (target.discardRow) {
    syncInvoiceReview(button.form);
    const row = invoiceReview.rows[Number(target.discardRow)];
    row.discard = !row.discard;
    render();
  } else if (button.id === 'cancel-purchase') {
    if (!window.confirm('Vols deixar aquest albarà sense desar?')) return;
    showNextInvoice();
    notify(invoiceReview ? 'Albarà saltat. Revisa el següent.' : '');
    render();
  } else if (button.id === 'cancel-all-purchases') {
    if (!window.confirm('Vols deixar sense desar aquest albarà i els '+invoiceQueue.length+' que falten?')) return;
    invoiceQueue = [];
    showNextInvoice();
    notify('');
    render();
  } else if (target.fixLine) {
    openSavedArticlePicker(target.fixLine,Number(target.fixPosition));
  } else if (target.purchase) {
    openPurchase = openPurchase === target.purchase ? '' : target.purchase;
    render();
  } else if (target.bulk) {
    const selected = data.articles.filter(article => mergeSelection.has(article.id));
    if (!selected.length) return;
    // Sense confirmació i amb Desfés. Els que es fan servir no s'eliminen (l'avís diu quins).
    if (target.bulk === 'delete') {
      await runBulk(selected.map(article => [article.name,{action:'deleteArticle',id:article.id}]),button,done => {
        mergeSelection.clear();
        return done+(done === 1 ? ' article eliminat.' : ' articles eliminats.');
      },results => save({action:'restoreTrash',ids:results.map(result => result.trash)},null,null,saved => 'S’han recuperat '+saved.count+(saved.count === 1 ? ' article.' : ' articles.')));
    } else {
      const archived = !archivedArticles;
      await runBulk(selected.map(article => [article.name,{action:'archiveArticle',id:article.id,archived}]),button,done => {
        mergeSelection.clear();
        return done+(done === 1 ? ' article ' : ' articles ')+(archived ? 'arxivats.' : 'restaurats.');
      },(results,payloads) => runBulk(payloads.map(([name,payload]) => [name,{...payload,archived:!archived}]),null,done => 'S’ha desfet el canvi de '+done+(done === 1 ? ' article.' : ' articles.')));
    }
  } else if (target.articleSheet) {
    openOrderEditor(byId('articles',target.articleSheet),'',Object.hasOwn(target,'fromTools'));

    openOrderEditor(byId('articles',target.orderEditor),target.orderIndex);

    openCatalogEditor(byId(section,target.catalogEdit));

    edit = target.orderCatalog;
    render();
    document.querySelector('#catalog input')?.focus();

    await pickOrderArticle(target.markArticle,button);

  } else if (target.restoreOrder) {

    const lines = data.lines.filter(line => line.order_id === id && (!only || line.supplier_id === only));
    if (!lines.length) return;
    const rest = only ? new Set(data.lines.filter(line => line.order_id === id && line.supplier_id !== only).map(line => line.supplier_id)).size : 0;
    await flushDraft();
    const pending = data.draft.lines.length;
    const sent = new Set(lines.map(line => line.supplier_id).filter(supplier => sentInfo(id,supplier))).size;
    const question = (only
        ? 'Vols passar '+(lines.length === 1 ? 'l’article' : 'els '+lines.length+' articles')+' de '+lines[0].supplier+' a «Nova comanda» per editar-'+(lines.length === 1 ? 'lo' : 'los')+'?'
        : 'Vols passar els '+lines.length+(lines.length === 1 ? ' article' : ' articles')+' d’aquesta comanda a «Nova comanda» per editar-la?')+
      (pending ? ' S’afegiran '+(pending === 1 ? 'a l’article' : 'als '+pending+' articles')+' que ja hi tens.' : '')+
      (sent ? ' Ja n’havies enviat '+(sent === 1 ? '1 missatge' : sent+' missatges')+'.' : '')+
      (only ? ' El missatge de '+lines[0].supplier+' s’eliminarà de l’historial'+(rest ? '; els dels altres proveïdors s’hi queden.' : '.')
        : ' La comanda i els seus missatges s’eliminaran de l’historial.');
    if (!window.confirm(question)) return;
    await save({action:'restoreOrder',id,...(only ? {supplier:only} : {}),revision:data.draft.revision},() => {
      if (openOrder === id) openOrder = '';
      onlyOrdered = true;
      orderCategory = '';
      orderSupplier = '';
      section = 'order';
    },button,() => 'Comanda recuperada: ja la pots editar a «Nova comanda».');
  } else if (target.order) {
    openOrder = openOrder === target.order ? '' : target.order;
    render();
    [...content.querySelectorAll('[data-order]')].find(item => item.dataset.order === target.order)?.focus();
  } else if (Object.hasOwn(target,'copy')) {
    const field = button.closest('section').querySelector('textarea');
    try {
      await navigator.clipboard.writeText(field.value);
      notify('Missatge copiat.');
    } catch {
      field.select();
      notify('Seleccionat. Pots copiar el missatge manualment.');
    }
  }
});

    } else {

      suggestSharedArticle(event.target.value);
      form.elements.sharedName.value = sharedArticleName;
      form.elements.id.value = sharedArticleId;
    }
    form.elements.alias.value = byId('articles',sharedArticleId)?.name || '';

  }
  if (event.target.matches('[data-contact-choice] select')) {
    event.target.form.elements.phone.value = event.target.value ? '+'+event.target.value : '';

  if (event.target.matches('[data-contact-email-choice] select')) {

  }
  if (Object.hasOwn(event.target.dataset,'contactFile')) {
    const file = event.target.files[0];
    if (!file) return;
    try {
      const contact = file.size <= 256*1024 ? vCardContact(await file.text()) : null;
      if (!event.target.isConnected) return;

      fillContact(event.target.form,contact);
    } catch {
      notify('Tria una targeta .vcf amb un sol contacte.',true);

  if (event.target.id === 'pdf-supplier') {

    field.required = event.target.value === 'new';
    if (field.required) field.focus();

  if (event.target.matches('#catalog-line select[name=supplier]')) {

    const article = byId('articles',form.elements.article.value);

    form.elements.unit.value = offerUnit(article,offer);
  }
  if (event.target.matches('#offer select[name=supplier]')) {
    const offer = data.offers.find(item => item.article_id === edit && item.supplier_id === event.target.value);
